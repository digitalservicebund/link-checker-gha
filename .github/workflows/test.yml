name: Link Checker Test

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      sitemap_url:
        description: "The URL of the sitemap.xml to parse"
        required: true
        default: "https://zfl.bund.de/sitemap-0.xml"
        type: string

jobs:
  link-checker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test
        uses: ./
        with:
          SITEMAP_URL: ${{ inputs.sitemap_url }}
