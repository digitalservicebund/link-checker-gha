name: Link Checker Test

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      sitemap_url:
        description: "The URL of the sitemap.xml to parse"
        required: true
        default: "https://zfl.bund.de/sitemap-0.xml"
        type: string

jobs:
  link-checker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: test
        uses: ./
        with:
          SITEMAP_URL: ${{ inputs.sitemap_url }}
