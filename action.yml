name: Link Checker
description: "Detect broken links and report them to Slack"
inputs:
  SITEMAP_URL:
    description: "Entrypoint: All links on all pages in the sitemap will be scanned"
    required: true
  SLACK_BOT_TOKEN:
    description: "Bot token for the Slack app used to post the report"
    required: true
  SLACK_CHANNEL_ID:
    description: "ID of the Slack channel to post the report to"
    required: true
  CHECK_ARGS:
    description: "Optional additional arguments to pass to lychee link checker (e.g., '--exclude .js|/api/')"
    required: false
    default: "--exclude .js|/api/"
runs:
  using: composite
  steps:
    - name: Setup working-directory
      shell: bash
      run: |
        echo "LYCHEE_DIR=lychee" >> "$GITHUB_ENV"
        mkdir -p "lychee"

    - name: Restore lychee cache
      id: restore-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.LYCHEE_DIR }}/.lycheecache
        key: cache-lychee-${{ github.sha }}
        restore-keys: cache-lychee-

    - name: Install Lychee
      # third-party action, pin to commit SHA
      uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
      with:
        lycheeVersion: v0.22.0
        args: --version
    - name: Run Sitemap Check
      id: check-links
      shell: bash
      working-directory: ${{ env.LYCHEE_DIR }}
      env:
        SITEMAP_URL: ${{ inputs.SITEMAP_URL }}
        CHECK_ARGS: ${{ inputs.CHECK_ARGS }}
      run: |
        set -e

        # Save page URLs from sitemap to urls.txt
        curl -sSfL "$SITEMAP_URL" | lychee --dump --exclude 'schemas' - | sed 's|http://|https://|g' > urls.txt

        # Run lychee link checker for all page URLs
        lychee --cache --max-cache-age 1d \
          --max-redirects 5 \
          --verbose \
          --cookie-jar tmp_cookies \
          $CHECK_ARGS \
          --accept '100..=103,200..=299,403' \
          --format json $(cat urls.txt) > output.json || true  # || true to prevent early exit

    - name: Generate Slack Payload
      id: generate-payload
      shell: bash
      working-directory: ${{ env.LYCHEE_DIR }}
      env:
        SITEMAP_URL: ${{ inputs.SITEMAP_URL }}
        SLACK_CHANNEL_ID: ${{ inputs.SLACK_CHANNEL_ID }}
      run: |
        set -e

        BASE_URL=$(echo "$SITEMAP_URL" | sed -e 's|^[^/]*//||' -e 's|/.*$||')

        # 1. Merge logic (using a variable to keep the YAML clean)
        MERGE_SCRIPT='
          (.error_map | to_entries | map({
            key: .key,
            # filter out timeout errors (use only those with status code)
            value: [.value[] | select(.status.code) | { url: .url, status_code: .status.code }]
          }) | from_entries) as $errors |
          (.redirect_map | to_entries | map({
            key: .key,
            value: [
              .value[] | 
              .url as $link_url | 
              select(.status.redirects and .status.redirects != []) | 
              (.status.redirects | last) as $dest_url | 
              select($link_url != $dest_url and ($dest_url | startswith($link_url) | not)) |
              { url: $link_url, dest_url: $dest_url }
            ]
          }) | from_entries) as $redirects |
          (($errors | keys) + ($redirects | keys) | unique) | map({
            key: .,
            value: (($errors[.] // []) + ($redirects[.] // []))
          }) | 
          from_entries |
          with_entries(select(.value | length > 0))
        '
        jq "$MERGE_SCRIPT" output.json > merged_issues.json

        # 2. Transform merged_issues.json into Slack payload format
        SLACK_SCRIPT='
          {
            "channel": $channel,
            "text": "*LinkChecker* found \(to_entries | map(.value | length) | add) issues on \($base_url)",
            "blocks": [
              {
                "type": "section",
                "text": { 
                  "type": "mrkdwn", 
                  "text": "*LinkChecker* found \(to_entries | map(.value | length) | add) issues on \($base_url):"
                }
              },
              (to_entries[] | {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ("*<\(.key)|\(.key)>*\n" + ([.value[] | if .status_code then "   ❌ <\(.url)|broken link>" elif .dest_url then "   ⚠️ <\(.url)|link> leads to <\(.dest_url)|another destination>" else empty end] | join("\n")))
                }
              })
            ]
          }
        '
        jq --arg base_url "$BASE_URL" --arg channel "$SLACK_CHANNEL_ID" "$SLACK_SCRIPT" merged_issues.json > slack_payload.json

        echo ""
        echo "--- DEBUG: SLACK PAYLOAD START ---"
        jq . slack_payload.json
        echo "--- DEBUG: SLACK PAYLOAD END ---"

        # Check if we have issues to report (blocks length > 1 because of header)
        if [ "$(jq '.blocks | length' slack_payload.json)" -gt 1 ]; then
          echo "HAS_ISSUES=true" >> $GITHUB_OUTPUT
        else
          echo "HAS_ISSUES=false" >> $GITHUB_OUTPUT
        fi

    - name: Post results to Slack
      if: steps.generate-payload.outputs.HAS_ISSUES == 'true'
      # third-party action, pin to commit SHA
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
      with:
        method: chat.postMessage
        token: ${{ inputs.SLACK_BOT_TOKEN }}
        payload-file-path: ./${{ env.LYCHEE_DIR }}/slack_payload.json

    - name: Save lychee cache
      uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      if: always()
      with:
        path: ${{ env.LYCHEE_DIR }}/.lycheecache
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}
